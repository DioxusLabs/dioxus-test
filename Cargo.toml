[package]
name = "dioxus-test"
version = "0.1.0"
authors = ["Bradford Hovinen"]
edition = "2024"
description = "Test library for Dioxus based on native renderer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/DioxusLabs/dioxus-test/"
homepage = "https://dioxuslabs.com/learn/0.7/getting_started"
keywords = ["dom", "ui", "gui", "react", "testing"]

[dependencies]
accesskit = "0.25"
blitz-dom = { git = "https://github.com/hovinen/blitz", branch = "support-html-label-for-accessible-name", default-features = false }
blitz-traits = { git = "https://github.com/hovinen/blitz", branch = "support-html-label-for-accessible-name", default-features = false }
dioxus-core = { git = "https://github.com/DioxusLabs/dioxus" }
dioxus-html = { git = "https://github.com/DioxusLabs/dioxus" }
dioxus-native-dom = { git = "https://github.com/DioxusLabs/dioxus" }
smallvec = "1.15.2"
style = { version = "0.22.0", git = "https://github.com/DioxusLabs/stylo", rev = "d6502e0002e9c40c43a0a4776f9e7eb93be360e3", package = "stylo" }
test-that = { version = "0.6.0", default-features = false, features = ["regex", "num-traits"] }
tokio = { version = "1.48", features = ["time"] }
tracing = { version = "0.1.41" }

[patch.crates-io]
blitz-dom = { git = "https://github.com/hovinen/blitz", branch = "support-html-label-for-accessible-name" }
blitz-traits = { git = "https://github.com/hovinen/blitz", branch = "support-html-label-for-accessible-name" }

[dev-dependencies]
dioxus= { git = "https://github.com/DioxusLabs/dioxus" }
indoc = "2.0.7"
tokio = { version = "1.48", features = ["rt", "macros"] }
